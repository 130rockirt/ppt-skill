<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!--
    图带字卡片模板（式一：左图右文）
    使用说明：
    1. 将 <!-- 图片占位 --> 注释替换为 <image href="你的图片.png" x="80" y="90" width="720" height="720" preserveAspectRatio="xMidYMid slice"/>，并删除占位矩形；
    2. 修改下方标题与正文文字内容；
    3. 导出 PNG（建议 1600x900 或更高）后插入 PPT；
    4. 如需要式三（左文右图），把图片块与文字块两组 x 坐标互换即可。
    字体：标题黑体（SimHei），正文宋体（SimSun），行距约 1.4。
  -->

  <!-- 背景 -->
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ===== 图片区（左，720x720） ===== -->
  <!-- 图片占位：替换为下面的 image 元素并删除本矩形
  <rect x="80" y="90" width="720" height="720" rx="24" fill="#eef1f5" stroke="#c8d0da" stroke-width="2"/>
  <text x="440" y="448" text-anchor="middle" font-family="SimHei, sans-serif" font-size="32" fill="#9aa4b0">图片区（720 × 720）</text>
  <text x="440" y="492" text-anchor="middle" font-family="SimSun, serif" font-size="24" fill="#b3bcc6">替换为 &lt;image&gt; 元素以插入真实图片</text>
  -->
  <image href="YOUR_IMAGE.png" x="80" y="90" width="720" height="720" preserveAspectRatio="xMidYMid slice"/>

  <!-- ===== 文字区（右，约 700 宽） ===== -->
  <!-- 分类标签 -->
  <text x="860" y="150" font-family="SimHei, sans-serif" font-size="26" fill="#8a94a0">分类标签</text>

  <!-- 标题（黑体） -->
  <text x="860" y="230" font-family="SimHei, sans-serif" font-size="56" font-weight="bold" fill="#1a1f26">这里是标题文字</text>

  <!-- 分隔线 -->
  <line x1="860" y1="270" x2="1520" y2="270" stroke="#d0d6dd" stroke-width="3"/>

  <!-- 正文（宋体，行距约 1.4：28px 字号 + 40px 行高） -->
  <text x="860" y="330" font-family="SimSun, serif" font-size="28" fill="#333a42">这里是第一行正文，说明图片承载的核心要点，</text>
  <text x="860" y="370" font-family="SimSun, serif" font-size="28" fill="#333a42">每行不超过 30 个字，整体不超过 5 行。</text>
  <text x="860" y="410" font-family="SimSun, serif" font-size="28" fill="#333a42">正文使用宋体，行距保持在 1.3–1.5 之间。</text>
  <text x="860" y="450" font-family="SimSun, serif" font-size="28" fill="#333a42">可根据实际内容增加或删减行。</text>

  <!-- 要点（可选：多段文字时使用，与正文同字体） -->
  <text x="860" y="540" font-family="SimHei, sans-serif" font-size="26" fill="#1a1f26">• 要点一：一句话概述</text>
  <text x="860" y="590" font-family="SimHei, sans-serif" font-size="26" fill="#1a1f26">• 要点二：一句话概述</text>
  <text x="860" y="640" font-family="SimHei, sans-serif" font-size="26" fill="#1a1f26">• 要点三：一句话概述</text>
</svg>